# Plain FTP server for comparing the SFTP plugin with Sally's FTP plugin (manual use only, not used by the tests).
# Port 2121 (control), passive data ports 30000-30009; user test / test, root = /home/test (same fixtures as SFTP).
listen=YES
listen_ipv6=NO
listen_port=2121
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=NO
use_localtime=YES
xferlog_enable=NO
connect_from_port_20=NO
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1
ftpd_banner=Sally FTP test server (vsftpd)
